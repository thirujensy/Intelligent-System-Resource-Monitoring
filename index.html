<!DOCTYPE html>
<html>
<head>
    <title>System Health Monitor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>System Resource Monitor</h1>

        <div class="card">
            <h2>CPU Usage</h2>
            <p id="cpu">Loading...</p>
        </div>

        <div class="card">
            <h2>Memory Usage</h2>
            <p id="memory">Loading...</p>
        </div>

        <div class="card">
            <h2>Disk Usage</h2>
            <p id="disk">Loading...</p>
        </div>

        <div class="card">
            <h2>Prediction</h2>
            <p id="prediction">Loading...</p>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
